name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: impulso
          POSTGRES_PASSWORD: impulso
          POSTGRES_DB: impulso
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U impulso" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://impulso:impulso@localhost:5432/impulso
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Linter
        run: ruff check .
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --create-db --cov --cov-report=term
      - name: Cobertura mínima de servicios (85%)
        run: coverage report --include="apps/*/services.py" --fail-under=85
