{% load formato %}<table class="table table-sm table-hover align-middle"><thead><tr><th>Código</th><th>Producto</th><th class="num">Precio</th></tr></thead><tbody>
{% for p in resultados %}<tr><td>{{ p.codigo }}</td><td><a href="{% url 'productos:detalle' p.pk %}">{{ p.nombre }}</a></td><td class="num">{{ p.precio_venta|pesos }}</td></tr>
{% empty %}<tr><td colspan="3" class="text-secondary">{% if request.GET.q %}Sin resultados.{% else %}Escribí o escaneá para buscar.{% endif %}</td></tr>{% endfor %}
</tbody></table>
