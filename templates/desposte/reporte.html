{% extends "base/base.html" %}
{% block contenido %}
<h1 class="h4 mb-3">Reportes de desposte</h1>
<form class="row g-2 mb-3 align-items-end">
  <div class="col-md-4"><label class="form-label small">Reporte</label><select name="tipo" class="form-select">{% for k, v in reportes.items %}<option value="{{ k }}" {% if k == tipo %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></div>
  <div class="col-md-2"><label class="form-label small">Desde</label><input type="date" name="desde" class="form-control" value="{{ desde|date:'Y-m-d' }}"></div>
  <div class="col-md-2"><label class="form-label small">Hasta</label><input type="date" name="hasta" class="form-control" value="{{ hasta|date:'Y-m-d' }}"></div>
  <div class="col-md-4 d-flex gap-2"><button class="btn btn-primary">Ver</button><button class="btn btn-outline-secondary" name="exportar" value="xlsx">Excel</button><button class="btn btn-outline-secondary" name="exportar" value="pdf">PDF</button><button class="btn btn-outline-secondary" name="exportar" value="csv">CSV</button></div>
</form>
<div class="table-responsive"><table class="table table-sm"><thead><tr>{% for e in encabezados %}<th>{{ e }}</th>{% endfor %}</tr></thead><tbody>
{% for fila in filas %}<tr>{% for v in fila %}<td>{{ v }}</td>{% endfor %}</tr>{% empty %}<tr><td colspan="{{ encabezados|length }}" class="text-secondary">Sin datos en el período.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
